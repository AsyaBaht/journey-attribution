[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-attribution"
version = "0.1.0"
description = "Multi-touch attribution on GA4 journey data, validated against a simulator with known ground truth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "lightgbm>=4.0",
    "shap>=0.44",
    "scikit-learn>=1.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.11"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
journey-attribution = "journey_attribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
